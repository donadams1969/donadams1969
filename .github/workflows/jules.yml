name: JULES AUTO-REGEN SUPREME
on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Jules Script Executable
        run: |
          if [ -f jules.sh ]; then
            chmod +x jules.sh
          else
            echo "jules.sh missing — this should not happen after fix"
            exit 1
          fi
      - name: Run Jules Auto-Regen Supreme
        run: bash jules.sh
