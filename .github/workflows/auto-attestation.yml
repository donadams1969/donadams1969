# valoraiplus2e_ :: Auto-Attestation Report Generator v2 — DG77.77X-Ξ RECODED
name: Auto-Attestation Report
on:
  workflow_run:
    workflows: ["liveness.yml", "claim-guard.yml", "release-attest.yml"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Live Attestation Snippet
        run: |
          mkdir -p docs/security
          cat > docs/security/auto_attestation_snippet.md << 'EOF'
          <!-- AUTO-GENERATED BY VALORAIPLUS ATTESTATION PIPELINE -->
          **Last Attestation:** `$(date -u +"%Y-%m-%d %H:%M:%S UTC")`
          **Runtime:** `valor_aiplusexecutive_runtime`
          **Module:** `valoraiplus_module_id_77x_final`
          **Node:** `SAINT_PAUL_GENESIS`
          **Peg:** `1:1 — JAXX2025`
          EOF
      - name: Inject Snippet into README (Atomic Replace)
        run: |
          snippet=$(cat docs/security/auto_attestation_snippet.md)
          perl -i -pe '
            BEGIN { undef $/; }
            s/(<!-- VALORAIPLUS_ATTESTATION_START -->).*?(<!-- VALORAIPLUS_ATTESTATION_END -->)/$1\n'"$snippet"'\n$2/s
          ' README.md
      - name: Commit & Push Updated Attestation
        run: |
          git config user.name "valoraiplus2e_bot"
          git config user.email "bot@valoraiplus2e.ai"
          git add README.md docs/security/
          git commit -m "chore: refresh valoraiplus2e_ live attestation [skip ci]" || exit 0
          git push
