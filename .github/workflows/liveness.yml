name: liveness
on:
  push: { branches: [ "main" ] }
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  prove-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UTC timestamp
        id: ts
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pynacl

      - name: Restore signer
        run: |
          mkdir -p keys artifacts receipts
          echo "${RECEIPT_PRIV_B64}" | base64 -d > keys/private.key
        env: { RECEIPT_PRIV_B64: ${{ secrets.RECEIPT_PRIV_B64 }} }

      - name: Prepare receipt (canonical + merkle + link)
        id: gen
        run: |
          python - <<'PY'
import json, os, hashlib, pathlib, uuid

state_path = pathlib.Path("receipts/CHAIN.state")
default_state = {
    "run_number": 0,
    "merkle_root": "",
    "chain_height": 0,
    "payload_sha256": "",
    "workflow_sha256": "",
    "workflow_ref": "",
}
if state_path.exists():
    try:
        with state_path.open("r", encoding="utf-8") as fh:
            stored = json.load(fh)
    except json.JSONDecodeError:
        stored = {}
else:
    stored = {}
state = {**default_state, **stored}

workflow_path = pathlib.Path(".github/workflows/liveness.yml")
workflow_bytes = workflow_path.read_bytes()
workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "").strip()
if not workflow_ref:
    repo = os.environ["GITHUB_REPOSITORY"]
    workflow_ref = f"{repo}/{workflow_path.as_posix()}@{os.environ['GITHUB_REF']}"
else:
    repo = os.environ["GITHUB_REPOSITORY"]


core = {
    "iso_time": os.environ["NOW"],
    "workflow": os.environ["GITHUB_WORKFLOW"],
    "run_id": os.environ["GITHUB_RUN_ID"],
    "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
    "commit_sha": os.environ["GITHUB_SHA"],
    "actor": os.environ["GITHUB_ACTOR"],
    "repo": repo,
    "run_nonce": uuid.uuid4().hex,
    "prev_chain_root": state.get("merkle_root", ""),
    "chain_height": int(state.get("chain_height", 0)) + 1,
    "workflow_path": workflow_path.as_posix(),
    "workflow_ref": workflow_ref,
    "workflow_sha256": hashlib.sha256(workflow_bytes).hexdigest(),
}

def h(data: bytes) -> str:
    return hashlib.sha256(data).hexdigest()

core_json = json.dumps(core, separators=(",", ":"), sort_keys=True).encode()
doc = dict(core)
doc["merkle_root"] = h(core_json)
body_json = json.dumps(doc, separators=(",", ":"), sort_keys=True).encode()
doc["payload_sha256"] = h(body_json)
pathlib.Path("artifacts").mkdir(exist_ok=True)
pathlib.Path("artifacts/liveness.json").write_bytes(
    json.dumps(doc, separators=(",", ":"), sort_keys=True).encode()
)
PY
        env:
          NOW:                ${{ steps.ts.outputs.now }}
          GITHUB_WORKFLOW:    ${{ github.workflow }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_ACTOR:       ${{ github.actor }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_REF:         ${{ github.ref }}

      - name: Sign liveness (Ed25519)
        run: |
          python tools/ed25519_sign.py sign \
            --priv keys/private.key \
            --file artifacts/liveness.json \
            --out artifacts/liveness.json.sig

      - name: RFC3161 timestamp token (optional)
        if: ${{ secrets.RFC3161_TSA_URL != '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y libmozilla-psm
          pip install rfc3161-client
          python - <<'PY'
from rfc3161_client import RemoteTimestamper
import hashlib

data = open("artifacts/liveness.json", "rb").read()
ts = RemoteTimestamper("${{ secrets.RFC3161_TSA_URL }}").timestamp(data=hashlib.sha256(data).digest())
open("artifacts/liveness.rfc3161.tsr", "wb").write(ts)
PY

      - name: OpenTimestamps (fallback, optional)
        if: ${{ secrets.RFC3161_TSA_URL == '' }}
        run: |
          pip install opentimestamps-client
          ots stamp artifacts/liveness.json || true
          [ -f artifacts/liveness.json.ots ] && mv artifacts/liveness.json.ots artifacts/liveness.ots || true

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: liveness-receipts
          path: artifacts/*
