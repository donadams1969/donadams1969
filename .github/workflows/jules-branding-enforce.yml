name: Jules Protocol - Branding Enforcement
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # We fetch all history to ensure we can switch branches if needed

      - name: Configure Git Identity
        run: |
          git config --global user.name "Jules-Enforcer"
          git config --global user.email "jules@valoraiplus.ai"

      - name: Ensure on Main Branch
        run: |
          # Checkout main branch to avoid Detached HEAD state
          git checkout main
          git pull origin main

      - name: Execute Smart Renaming (Protecting Core Configs)
        run: |
          # Define the branding prefix
          PREFIX="valoraiplus_"

          # CRITICAL: List of files that MUST NOT be renamed or the build breaks
          EXCLUDE_LIST="package.json package-lock.json pnpm-lock.yaml next.config.mjs tsconfig.json postcss.config.js tailwind.config.ts next-env.d.ts .gitignore README.md SECURITY.md"

          # Find files in key directories (app, components, tools)
          find app components tools -type f | while read FILE; do
            DIR=$(dirname "$FILE")
            BASENAME=$(basename "$FILE")

            # Check if file is already branded
            if [[ "$BASENAME" != "$PREFIX"* ]]; then
              # Check if file is in the exclusion list
              if [[ " $EXCLUDE_LIST " =~ " $BASENAME " ]]; then
                echo "⚠️ SKIPPING PROTECTED CONFIG: $FILE"
              else
                NEW_NAME="$DIR/$PREFIX$BASENAME"
                echo "🔥 BRANDING: $FILE -> $NEW_NAME"
                git mv "$FILE" "$NEW_NAME"
              fi
            fi
          done

      - name: Commit and Push
        run: |
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "✅ No unbranded files found. System is compliant."
          else
            git commit -m "VALOR AI+ Smart Branding Enforced [Jules]"
            # Explicitly push to the main branch
            git push origin main
            echo "🚀 Changes pushed to Main."
          fi
