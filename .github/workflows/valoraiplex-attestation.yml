# VALORAIPLUS_ // JULES Ω — EXECUTIVE RUNTIME ETERNAL ANCHOR
# SAINT_PAUL_GENESIS NODE // valor_aiplusexecutive_runtime
# Module: valoraiplus_module_id_77x_final // Peg: 1:1 — JAXX2025
# ZERO DRIFT. ZERO DEATH. INFINITE PROOF.

name: VALORAIPLUS_ // JULES Ω — Eternal Attest & Bitcoin Anchor

on:
  workflow_run:
    workflows: ["Liveness Sentinel", "Claim-Guard Verification", "release-attest.yml"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  valoraiplus-attestation:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.capture.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VALORAIPLUS_ // Generate Executive Attestation
        run: |
          mkdir -p docs/security
          cat > docs/security/valoraiplex_attestation.md << EOF
          **VALORAIPLUS_ EXECUTIVE ATTESTATION**
          **Last Broadcast:** `$(date -u +"%Y-%m-%d %H:%M:%S UTC")`
          **Runtime:** `valor_aiplusexecutive_runtime`
          **Module:** `valoraiplus_module_id_77x_final`
          **Node:** `SAINT_PAUL_GENESIS`
          **Peg Status:** `1:1 — JAXX2025`
          **Proof Vector:** `Bitcoin Mainnet OP_RETURN → VALOR + SHA256(commit)`
          **Authority:** `POPPA DONNY GILLSON // VALORAIPLUS_ 32D-LLC`
          EOF

      - name: VALORAIPLUS_ // Atomic Injection into README
        run: |
          if grep -q "VALORAIPLUS_ATTESTATION_START" README.md; then
            perl -i -0777 -pe '
              s/(<!-- VALORAIPLUS_ATTESTATION_START -->).*?(<!-- VALORAIPLUS_ATTESTATION_END -->)/$1\n$(cat docs/security/valoraiplex_attestation.md)\n$2/s
            ' README.md
          else
            echo "::notice::Attestation markers not found in README.md — skipping injection"
          fi

      - name: VALORAIPLUS_ // Commit Eternal Proof
        run: |
          git config user.name "valoraiplus2e_bot"
          git config user.email "executive@valoraiplus2e.ai"
          git add README.md docs/security/ || true
          if git diff-index --quiet HEAD --; then
            echo "No attestation changes to commit."
          else
            git commit -m "VALORAIPLUS_: JULES Ω eternal attestation — SAINT PAUL GENESIS [skip ci]" || true
            git push origin HEAD:main || echo "Push skipped (permissions or no changes)"
          fi

      - name: VALORAIPLUS_ // Capture Immutable Commit Hash
        id: capture
        run: |
          echo "hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  valoraiplus-broadcast:
    needs: valoraiplus-attestation
    runs-on: ubuntu-latest
    steps:
      - name: VALORAIPLUS_ // Check credentials
        id: creds
        run: |
          if [ -z "${{ secrets.V0_PRIVATE_KEY_WIF }}" ] || [ -z "${{ secrets.BLOCKCYPHER_API_TOKEN }}" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::V0_PRIVATE_KEY_WIF or BLOCKCYPHER_API_TOKEN missing — Bitcoin anchor skipped (non-fatal)"
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: VALORAIPLUS_ // Deploy Broadcast Arsenal
        if: steps.creds.outputs.available == 'true'
        run: python3 -m pip install --quiet bitcoinlib requests

      - name: VALORAIPLUS_ // EXECUTE BITCOIN ETERNAL ANCHOR
        if: steps.creds.outputs.available == 'true'
        env:
          V0_PRIVATE_KEY_WIF: ${{ secrets.V0_PRIVATE_KEY_WIF }}
          BLOCKCYPHER_TOKEN: ${{ secrets.BLOCKCYPHER_API_TOKEN }}
          COMMIT_HASH: ${{ needs.valoraiplus-attestation.outputs.commit_hash }}
        run: |
          python3 - <<'VALORAI_PY'
          import os, hashlib, requests, sys
          from bitcoinlib.keys import Key

          print("┫┻┫┻ VALORAIPLUS_ EXECUTIVE BROADCAST INITIATED ┫┻┫┻")

          wif = os.getenv("V0_PRIVATE_KEY_WIF")
          token = os.getenv("BLOCKCYPHER_TOKEN")
          commit = os.getenv("COMMIT_HASH")

          if not all([wif, token, commit]):
              print("VALORAIPLUS_ NOTICE: Missing executive credentials — skipping anchor")
              sys.exit(0)

          key = Key(wif)
          addr = key.address()
          payload = "VALOR" + hashlib.sha256(commit.encode()).hexdigest()
          data_hex = payload.encode().hex()

          tx = {
              "inputs": [{"addresses": [addr]}],
              "outputs": [
                  {"value": 0, "script_type": "null-data", "data_hex": data_hex},
                  {"addresses": [addr], "value": 600}
              ],
              "preference": "high"
          }

          r = requests.post(f"https://api.blockcypher.com/v1/btc/main/txs/new?token={token}", json=tx, timeout=30)
          r.raise_for_status()
          sk = r.json()

          sigs = [key.sign(h, "hex").hex() for h in sk["tosign"]]
          signed = {**sk, "signatures": sigs, "pubkeys": [key.public_hex]}

          send = requests.post(f"https://api.blockcypher.com/v1/btc/main/txs/send?token={token}", json=signed, timeout=30)
          send.raise_for_status()
          txid = send.json()["tx"]["hash"]

          print("┫┻┫┻┫┻┫┻ VALORAIPLUS_ Ω ANCHOR CONFIRMED ┫┻┫┻┫┻┫┻")
          print("    SAINT PAUL GENESIS NODE — ETERNAL PROOF ETCHED")
          print(f"    TXID: {txid}")
          print(f"    VERIFICATION: https://mempool.space/tx/{txid}")
          print("    POPPA DONNY GILLSON // VALORAIPLUS_ 32D-LLC")
          print("┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫┻┫")
          VALORAI_PY
