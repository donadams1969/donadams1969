name: Deploy to AWS GovCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-gov-west-1  # or us-gov-east-1
  STACK_NAME: valoraiplus-govcloud-stack
  TEMPLATE_FILE: template.yml  # Your CloudFormation template
  PARAMETERS_FILE: parameters.json  # Optional params

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GOV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GOV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template --template-body file://${{ env.TEMPLATE_FILE }} --region ${{ env.AWS_REGION }}

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GOV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GOV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: ${{ env.TEMPLATE_FILE }}
          parameter-overrides: file://${{ env.PARAMETERS_FILE }}  # Optional
          no-fail-on-empty-changeset: true
          capabilities: CAPABILITY_IAM CAPABILITY_NAMED_IAM

      - name: Post-deployment validation
        run: |
          # Add custom validation scripts here, e.g., check stack status
          aws cloudformation wait stack-create-complete --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}
          echo "Stack deployed successfully!"

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_GOV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GOV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback on failure
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }} --region ${{ env.AWS_REGION }}
          echo "Rollback complete due to deployment failure."
