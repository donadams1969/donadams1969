name: Claim-Guard Verification

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify lattice (safe even if evidence/ is empty)
        run: |
          mkdir -p evidence
          python3 scripts/valor_attest.py --verify evidence/ | tee attestation.json

      - name: Record to Genesis (only if endpoint configured)
        if: ${{ secrets.GENESIS_ENDPOINT != '' }}
        env:
          GENESIS_ENDPOINT: ${{ secrets.GENESIS_ENDPOINT }}
        run: |
          curl -fsSL -X POST "$GENESIS_ENDPOINT" \
            -H 'content-type: application/json' \
            --data-binary @attestation.json \
          || echo "GENESIS post failed/omitted (non-fatal)"

      - name: Upload Guard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-guard-attestation
          path: attestation.json
          if-no-files-found: ignore
