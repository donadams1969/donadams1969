name: register-snapshot
on:
  workflow_dispatch:
    inputs:
      snapshot_file:
        description: 'The path to the snapshot file to register.'
        required: true
        default: 'snapshots/OP25_RETURN_HEX_GENESIS_V3.8_FULL.md'

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      RECEIPT_PRIV_B64: ${{ secrets.RECEIPT_PRIV_B64 }}
      SNAPSHOT_FILE: ${{ github.event.inputs.snapshot_file }}

    steps:
      - uses: actions/checkout@v4

      - name: UTC timestamp
        id: ts
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pynacl

      - name: Restore signer
        run: |
          mkdir -p keys artifacts receipts
          echo "$RECEIPT_PRIV_B64" | base64 -d > keys/private.key

      - name: Prepare receipt
        id: gen
        run: |
          MANIFEST_HASH=$(cat "${SNAPSHOT_FILE}.sha512")
          cat > artifacts/snapshot_receipt.json <<EOF
          {
            "iso_time": "${{ steps.ts.outputs.now }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "repo": "${{ github.repository }}",
            "snapshot_file": "$SNAPSHOT_FILE",
            "manifest_hash": "$MANIFEST_HASH"
          }
          EOF

      - name: Sign snapshot receipt (Ed25519)
        run: |
          python tools/ed25519_sign.py sign \
            --priv keys/private.key \
            --file artifacts/snapshot_receipt.json \
            --out artifacts/snapshot_receipt.json.sig

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-receipt
          path: artifacts/snapshot_receipt.json*
