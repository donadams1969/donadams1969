version: "3.9"
services:
  valoraiplus_dashboard:
    # The build context is set to '.', which is the root of the 'valoraiplus_dashboard' directory.
    # This ensures that the Dockerfile and all source code are included in the build.
    build: .
    container_name: valoraiplus_dashboard
    restart: always
    ports:
      - "2020:2020"
    volumes:
      # The data volume is mounted to '/app/data' inside the container.
      # This ensures that data generated by the application (reports, logs) persists
      # across container restarts. The WORKDIR in the Dockerfile is /app.
      - ./data:/app/data
    # The env_file directive tells Docker Compose to load environment variables
    # from a file named '.env' in the project directory.
    # This is a secure way to manage secrets like API keys and webhooks.
    env_file:
      - .env
    # The command executes the scheduler, which is located at the root of the /app directory.
    command: python3 scheduler.py