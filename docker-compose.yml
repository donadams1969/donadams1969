version: "3.9"
services:
  api:
    build: ./backend
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - SECRET_KEY=${SECRET_KEY}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - WISE_API_KEY=${WISE_API_KEY}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - BROKER_URL=redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on: [db, redis]
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=valorai
      - POSTGRES_PASSWORD=valorai
      - POSTGRES_DB=valorai
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]
  worker:
    build: ./orchestration
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/1
    depends_on: [api, redis]
volumes:
  dbdata:
