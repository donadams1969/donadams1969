version: "3.9"

services:
  saint-paul-node:
    build: ./saint-paul-node
    container_name: saint_paul_node
    environment:
      - ST_PAUL_NODE_TOKEN=${ST_PAUL_NODE_TOKEN}
    ports:
      - "8080:8080"
    restart: unless-stopped

  valorchain-g-mirror:
    image: python:3.12-slim
    container_name: valorchain_g_mirror
    volumes:
      - ./mirror:/mirror
    working_dir: /mirror
    environment:
      - VALORCHAIN_G_ENDPOINT=${VALORCHAIN_G_ENDPOINT}
      - VALORCHAIN_G_ENDPOINT_BACKUP=${VALORCHAIN_G_ENDPOINT_BACKUP}
    command: ["python3", "valorchain_dual_harness.py"]
    restart: on-failure
